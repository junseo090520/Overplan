<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Overplan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-box">
            <section class="auth-card">
                <p class="intro-label">LOGIN</p>
                <h1>다시 <span>만나서</span> 반가워요</h1>
                <p class="auth-desc">아이디와 비밀번호를 입력해 로그인하세요.</p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="name">아이디</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="아이디를 입력하세요"
                            maxlength="30"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p id="message" class="form-message" role="alert"></p>

                    <button type="submit" id="submitButton" class="primary-button">로그인</button>
                </form>

                <p class="auth-footer">
                    아직 계정이 없나요?
                    <a href="signup.html">회원가입</a>
                </p>
            </section>
        </div>
    </main>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
