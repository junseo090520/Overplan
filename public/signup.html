<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | Overplan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-box">
            <section class="auth-card">
                <p class="intro-label">SIGN UP</p>
                <h1>계정 <span>만들기</span></h1>
                <p class="auth-desc">몇 가지만 입력하면 바로 시작할 수 있어요.</p>

                <form id="signupForm" novalidate>
                    <div class="form-group">
                        <label for="name">아이디</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="아이디를 입력하세요"
                            maxlength="30"
                            autocomplete="username"
                            required
                        >
                        <p class="form-hint">영문, 숫자, _ 만 사용할 수 있어요. (4~30자)</p>
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="new-password"
                            required
                        >
                        <p class="form-hint">8자 이상으로 입력해주세요.</p>
                    </div>

                    <div class="form-group">
                        <label for="passwordConfirm">비밀번호 확인</label>
                        <input
                            type="password"
                            id="passwordConfirm"
                            name="passwordConfirm"
                            placeholder="비밀번호를 한 번 더 입력하세요"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="schoolKeyword">학교</label>
                        <div class="school-search">
                            <input
                                type="text"
                                id="schoolKeyword"
                                placeholder="학교 이름을 검색하세요"
                                autocomplete="off"
                            >
                            <button type="button" id="schoolSearchButton" class="secondary-button">검색</button>
                        </div>
                        <ul id="schoolResults" class="school-results" hidden></ul>
                        <p id="selectedSchool" class="selected-school" hidden></p>
                    </div>

                    <p id="message" class="form-message" role="alert"></p>

                    <button type="submit" id="submitButton" class="primary-button">회원가입</button>
                </form>

                <p class="auth-footer">
                    이미 계정이 있나요?
                    <a href="login.html">로그인</a>
                </p>
            </section>
        </div>
    </main>

    <script type="module" src="js/pages/signup.js"></script>
</body>
</html>
