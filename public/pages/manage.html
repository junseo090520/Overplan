<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overplan | 일정 관리</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/manage.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- 상단 네비게이션 -->
    <header class="header">
        <a href="calendar.html" class="logo">
            <span>Overplan</span>
        </a>

        <nav class="nav">
            <a href="calendar.html">▦ 캘린더</a>
            <a href="manage.html" class="active">☷ 일정 관리</a>
            <a href="mypage.html">♙ 마이페이지</a>
        </nav>

        <div class="header-right">
            <div class="search-box">
                <span>⌕</span>
                <input type="text" placeholder="일정, 과제, 키워드로 검색하세요...">
            </div>
        </div>
    </header>

    <main class="main-container">

        <!-- 페이지 제목 -->
        <section class="page-intro">
            <div>
                <p class="intro-label">SCHEDULE MANAGER</p>
                <h1>일정 <span>관리</span></h1>
                <p>등록한 일정을 날짜순으로 확인하고, 완료 처리하거나 삭제할 수 있어요.</p>
            </div>

        </section>

        <!-- 일정 목록 -->
        <article class="card manage-card">

            <div class="manage-toolbar">
                <div class="filter-group" role="group" aria-label="일정 필터">
                    <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
                        전체 <span data-count="all">0</span>
                    </button>
                    <button type="button" class="filter-button" data-filter="todo" aria-pressed="false">
                        미완료 <span data-count="todo">0</span>
                    </button>
                    <button type="button" class="filter-button" data-filter="done" aria-pressed="false">
                        완료 <span data-count="done">0</span>
                    </button>
                </div>
            </div>

            <div class="manage-list" id="manage-list">
                <!-- JavaScript에서 날짜별로 일정을 그립니다 -->
            </div>

        </article>
    </main>

    <!-- 일정 수정 팝업 -->
    <dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-heading">
        <form id="edit-form" novalidate>
            <h2 id="edit-heading">일정 수정</h2>

            <div class="form-field">
                <label for="edit-title">일정 이름</label>
                <input type="text" id="edit-title" maxlength="100" autocomplete="off">
            </div>

            <div class="form-field">
                <label for="edit-type">일정 종류</label>
                <select id="edit-type">
                    <option value="exam">시험</option>
                    <option value="school">학교 일정</option>
                    <option value="assessment">수행평가</option>
                    <option value="assignment">개인 과제</option>
                    <option value="other">기타</option>
                </select>
            </div>

            <div class="form-field">
                <label for="edit-date">날짜</label>
                <input type="date" id="edit-date">
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="edit-time">시작 시간</label>
                    <input type="time" id="edit-time">
                </div>

                <div class="form-field">
                    <label for="edit-end-time">종료 시간 (선택)</label>
                    <input type="time" id="edit-end-time">
                </div>
            </div>

            <div class="form-field">
                <label for="edit-description">세부내용 (선택)</label>
                <textarea id="edit-description" rows="4" maxlength="500"></textarea>
            </div>

            <p id="edit-message" class="form-message" role="alert"></p>

            <div class="button-row">
                <button type="submit" id="edit-save-button" class="primary-button">저장</button>
                <button type="button" id="edit-cancel-button" class="secondary-button">취소</button>
            </div>
        </form>
    </dialog>

    <script src="../js/pages/manage.js"></script>
</body>
</html>
