<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overplan | 캘린더</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/calendar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- 상단 네비게이션 -->
    <header class="header">
        <a href="calendar.html" class="logo">
            <span>Overplan</span>
        </a>

        <nav class="nav">
            <a href="calendar.html" class="active">▦ 캘린더</a>
            <a href="manage.html">☷ 일정 관리</a>
            <a href="mypage.html">♙ 마이페이지</a>
        </nav>

        <div class="header-right">
            <div class="search-box">
                <span>⌕</span>
                <input type="text" placeholder="일정, 과제, 키워드로 검색하세요...">
            </div>
        </div>
    </header>

    <main class="main-container">

        <!-- 캘린더 및 상세 영역 -->
        <section class="calendar-layout">

            <!-- 월간 캘린더 -->
            <article class="card calendar-card">
                
                <div class="calendar-header">
                    <div>
                        <p class="calendar-subtitle">MONTHLY SCHEDULE</p>

                        <div class="calendar-month">
                            <h2 id="month-title"></h2>
                            <button id="prev-month" aria-label="이전 달">‹</button>
                            <button id="next-month" aria-label="다음 달">›</button>
                        </div>
                    </div>

                    <div class="calendar-controls">
                        <button class="today-button" id="today-btn">오늘</button>
                        <select id="view-select">
                            <option value="month">월간 보기</option>
                        </select>
                    </div>
                </div>

                <!-- 일정 범례 -->
                <div class="calendar-legend">
                    <span><i class="pink"></i>시험</span>
                    <span><i class="blue"></i>학교 일정</span>
                    <span><i class="green"></i>수행평가</span>
                    <span><i class="purple"></i>개인 과제</span>
                    <span><i class="gray"></i>기타</span>
                </div>

                <!-- 달력 -->
                <div class="calendar-grid" id="calendar-grid">
                    <!-- JavaScript에서 날짜를 생성 -->
                </div>

            </article>

            <!-- 오른쪽 상세 영역 -->
            <aside class="calendar-sidebar">

                <!-- 선택 날짜 일정 -->
                <article class="card detail-card">
                    <div class="sidebar-title">
                        <div>
                            <p>SELECTED DATE</p>
                            <h2></h2>
                        </div>
                        <span class="date-icon">16</span>
                    </div>


                    <div class="detail-list" id="detail-list">
                        <!-- 선택한 날짜의 일정이 표시됩니다 -->
                    </div>

                    <button class="detail-add-button" id="detail-add-button">
                        ＋ 이 날짜에 일정 추가
                    </button>                    
                </article>

                <!-- 오늘 일정 완료율 -->
                <article class="card progress-card">
                    <div class="sidebar-title">
                        <div>
                            <p>PROGRESS</p>
                            <h2 id="progress-title">오늘 일정 완료율</h2>
                        </div>
                        <span class="progress-percent" id="today-progress-percent">0%</span>
                    </div>

                    <div class="progress-bar">
                        <div id="today-progress-bar"></div>
                    </div>

                    <p class="progress-info" id="today-progress-info">오늘 등록된 일정이 없습니다.</p>
                </article>

                <!-- 다가오는 일정 -->
                <article class="card upcoming-card">
                    <div class="sidebar-title">
                        <div>
                            <p>UPCOMING</p>
                            <h2>다가오는 일정</h2>
                        </div>
                    </div>

                    <!-- JavaScript에서 가장 가까운 날의 일정을 채웁니다 -->
                </article>

            </aside>
        </section>
    </main>
    <script src="../js/pages/calendar.js"></script>
</body>
</html>
